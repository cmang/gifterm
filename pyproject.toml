[build-system]
#requires = ["setuptools>=45", "wheel"]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gifterm"
description = "Play gif files in a terminal, with 256 colors, UTF8 ANSI and .Dur durdraw file output"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
version = "0.1.0"
classifiers = [
        'Environment :: Console',
        'Topic :: Artistic Software',
        'Topic :: Terminals',
        'Intended Audience :: End Users/Desktop',
        'Natural Language :: English',
        'Programming Language :: Python :: 3 :: Only',
        'Programming Language :: Python :: 3.10',
        'Programming Language :: Python :: 3.11',
        'Programming Language :: Python :: 3.12',
        'Programming Language :: Python :: 3.13',
        'Programming Language :: Python :: 3.14',
        'Programming Language :: Python :: 3.15',
        'Topic :: Utilities'
]
authors = [
  {name = "Sam Foster", email = "samfoster@gmail.com"},
]
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "Pillow>=9.0.0"
]

[project.urls]
Homepage = "https://github.com/cmang/gifterm"
Source = "https://github.com/cmang/gifterm"


[project.optional-dependencies]

[project.scripts]
gifterm = "gifterm:run"

[tool.setuptools]
py-modules = ["gifterm"]

[tool.setuptools.package-data]
